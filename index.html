<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İngilizce Pratik Koçum & Oyun</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; }
        .nav-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px; }
        button { padding: 10px 20px; border: none; border-radius: 8px; background: #3498db; color: white; font-size: 15px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        button:hover { background: #2980b9; }
        .btn-green { background: #2ecc71; } .btn-green:hover { background: #27ae60; }
        .btn-orange { background: #f39c12; } .btn-orange:hover { background: #d68910; }
        
        /* Özet Kutuları */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .box { background: #fafafa; padding: 20px; border-radius: 10px; border: 1px solid #eee; }
        .box h2 { border-bottom: 2px solid #3498db; padding-bottom: 5px; font-size: 1.2rem; color: #2c3e50; margin-top: 0;}
        .tag { background: #e8f4f8; color: #2980b9; padding: 3px 8px; border-radius: 15px; font-size: 0.85rem; font-weight: bold; display: inline-block; margin-bottom: 5px;}
        
        /* Form & Oyun Alanı */
        .section-panel { display: none; }
        .active-section { display: block; }
        .form-group { display: flex; flex-direction: column; gap: 10px; max-width: 500px; margin: auto; text-align: left; background: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px solid #ddd;}
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; width: 100%; box-sizing: border-box; font-family: inherit;}
        
        /* Oyun */
        .game-wrapper { text-align: center; }
        .question-box { background: #fff3cd; padding: 20px; border-radius: 10px; font-size: 1.2rem; margin-bottom: 20px; border: 1px solid #ffeeba; }
        .options { display: flex; flex-direction: column; gap: 10px; max-width: 400px; margin: auto; }
        .option-btn { background: #ecf0f1; color: #333; border: 2px solid #bdc3c7; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        
        .puzzle-input-area { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        #puzzle-input { font-size: 1.5rem; text-align: center; text-transform: lowercase; width: 250px; font-weight: bold; }
        
        .feedback-area { margin-top: 20px; font-weight: bold; font-size: 1.2rem; min-height: 30px; }
        .hidden { display: none !important; }
        @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }
        
        hr { border: 0; border-top: 1px solid #ddd; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Pratik Koçum & Oyun</h1>
    
    <div class="nav-buttons">
        <button onclick="showSection('summary')">📝 Defterim</button>
        <button class="btn-green" onclick="showSection('add-data')">➕ Deftere Ekle</button>
        <button onclick="showSection('game-test')">🎮 Çoktan Seçmeli</button>
        <button class="btn-orange" onclick="showSection('game-puzzle')">🧩 Yazmalı Bulmaca</button>
    </div>

    <!-- BÖLÜM 1: DEFTERİM -->
    <div id="summary" class="section-panel active-section">
        <div class="grid-container">
            <!-- Kutu 1: Kelimeler -->
            <div class="box">
                <h2>📦 Kutu 1: Yeni Kelimeler</h2>
                <div id="words-list"></div>
            </div>
            <!-- Kutu 2: Kalıplar -->
            <div class="box">
                <h2>💬 Kutu 2: Günlük Kalıplar</h2>
                <div id="phrases-list"></div>
            </div>
            <!-- Kutu 3: Otonna -->
            <div class="box" style="grid-column: 1 / -1;">
                <h2>🔄 Kutu 3: Otonna Dönüşümü</h2>
                <div id="otonna-list"></div>
            </div>
            <!-- Kutu 4: Dizilim -->
            <div class="box" style="grid-column: 1 / -1;">
                <h2>🧩 Kutu 4: Cümle Dizilim Formülü</h2>
                <div id="grammar-list"></div>
            </div>
        </div>
    </div>

    <!-- BÖLÜM 2: VERİ EKLEME (Kutu Seçmeli) -->
    <div id="add-data" class="section-panel game-wrapper">
        <h2>Deftere Kayıt Ekle</h2>
        <div class="form-group">
            <label><strong>Ne Eklemek İstiyorsun?</strong></label>
            <select id="data-type-selector" onchange="toggleForms()">
                <option value="word">Kutu 1: Kelime</option>
                <option value="phrase">Kutu 2: Günlük Kalıp</option>
                <option value="otonna">Kutu 3: Otonna Dönüşümü</option>
                <option value="grammar">Kutu 4: Cümle Formülü</option>
            </select>
            <hr>
            
            <!-- KELİME & KALIP FORMU -->
            <div id="form-vocab">
                <input type="text" id="new-word" placeholder="Kelime veya Kalıp (Örn: Utilize)">
                
                <div id="type-container" style="margin-top: 10px;">
                    <select id="new-type" onchange="checkCustomType()">
                        <option value="Verb / Fiil">Verb / Fiil</option>
                        <option value="Noun / İsim">Noun / İsim</option>
                        <option value="Adjective / Sıfat">Adjective / Sıfat</option>
                        <option value="Phrase / Kalıp">Phrase / Kalıp</option>
                        <option value="custom">Diğer (Kendim Yazacağım)</option>
                    </select>
                    <input type="text" id="custom-type" placeholder="Türü kendin yaz..." class="hidden" style="margin-top: 5px;">
                </div>
                
                <input type="text" id="new-pron" placeholder="Okunuşu/Telaffuz (Örn: yutilayz)" style="margin-top: 10px;">
                <input type="text" id="new-tr" placeholder="Türkçe Anlamı (Örn: Faydalanmak)" style="margin-top: 10px;">
                <input type="text" id="new-en" placeholder="İngilizce Tanımı (Örn: To use effectively)" style="margin-top: 10px;">
                
                <textarea id="new-scenario" class="hidden" placeholder="Senaryo (Bu kalıp nerede kullanılır?)" style="margin-top: 10px;"></textarea>
            </div>

            <!-- OTONNA FORMU -->
            <div id="form-otonna" class="hidden">
                <label><strong>Before (Önce):</strong></label>
                <input type="text" id="ot-before" placeholder="İngilizce (Örn: Companies use...)">
                <input type="text" id="ot-before-tr" placeholder="Türkçesi (Örn: Şirketler kullanır...)" style="margin-top: 5px;">
                
                <label style="display:block; margin-top: 10px;"><strong>After (Sonra):</strong></label>
                <input type="text" id="ot-after" placeholder="İngilizce (Örn: To expand their...)">
                <input type="text" id="ot-after-tr" placeholder="Türkçesi (Örn: Müşteri tabanını genişletmek için...)" style="margin-top: 5px;">
            </div>

            <!-- FORMÜL FORMU -->
            <div id="form-grammar" class="hidden">
                <input type="text" id="gr-formula" placeholder="Formül (Örn: Özne + Y.Fiil + Fiil + Nesne + Yer + Zaman)">
                <input type="text" id="gr-pos" placeholder="Olumlu Cümle (+)" style="margin-top: 10px;">
                <input type="text" id="gr-neg" placeholder="Olumsuz Cümle (-)" style="margin-top: 10px;">
                <input type="text" id="gr-q" placeholder="Soru Cümlesi (?)" style="margin-top: 10px;">
            </div>

            <button class="btn-green" onclick="saveData()" style="margin-top: 15px;">Kaydet ve Deftere Ekle</button>
            <p id="add-feedback" style="color: #27ae60; font-weight: bold; text-align:center;"></p>
        </div>
    </div>

    <!-- BÖLÜM 3: ÇOKTAN SEÇMELİ OYUN -->
    <div id="game-test" class="section-panel game-wrapper">
        <h2>Çoktan Seçmeli Test</h2>
        <div class="question-box" id="test-question">Soru buraya gelecek...</div>
        <div class="options" id="test-options"></div>
        <div id="test-feedback" class="feedback-area"></div>
        <button id="test-next" class="hidden" onclick="nextTestQuestion()" style="margin-top: 20px;">Sonraki Soru ➡️</button>
    </div>

    <!-- BÖLÜM 4: YAZMALI BULMACA -->
    <div id="game-puzzle" class="section-panel game-wrapper">
        <h2>🧩 Çengel Bulmaca (Tanımı Oku, Kelimeyi Yaz)</h2>
        <div class="question-box" id="puzzle-question">Tanım buraya gelecek...</div>
        
        <div class="puzzle-input-area">
            <input type="text" id="puzzle-input" placeholder="kelimeyi yazın..." autocomplete="off">
            <button class="btn-green" onclick="checkPuzzleAnswer()">Kontrol Et</button>
            <button class="btn-orange" onclick="givePuzzleHint()">İpucu</button>
        </div>
        
        <div id="puzzle-feedback" class="feedback-area"></div>
        <button id="puzzle-next" class="hidden" onclick="nextPuzzleQuestion()" style="margin-top: 20px;">Sonraki Bulmaca ➡️</button>
    </div>
</div>

<script>
    // --- VERİTABANI (Tüm Kutular İçin) ---
    let myData = JSON.parse(localStorage.getItem('myEngDataV2'));
    
    if (!myData) {
        // İlk açılış için örnek veriler
        myData = {
            vocab: [
                { id: 1, typeCat: "word", word: "Utilize", type: "Verb / Fiil", pron: "yutilayz", tr: "Faydalanmak", en: "To use something in an effective way." },
                { id: 2, typeCat: "phrase", word: "It depends on", type: "Phrase / Kalıp", pron: "it dipendz on", tr: "...e bağlı", en: "Used to say that something is affected by something else.", scenario: "Hafta sonu dışarı çıkacak mısın? -> It depends on the weather." }
            ],
            otonna: [
                { before: "Companies use social media to get more customers.", beforeTr: "Şirketler daha fazla müşteri bulmak için sosyal medyayı kullanır.", after: "To expand their customer base, companies utilize digital platforms.", afterTr: "Müşteri tabanlarını genişletmek için şirketler dijital platformlardan faydalanır." }
            ],
            grammar: [
                { formula: "Özne + Yardımcı Fiil + Fiil + Nesne + Yer + Zaman", pos: "I am studying English at home today.", neg: "I am not studying English at home today.", q: "Are you studying English at home today?" }
            ]
        };
        saveToLocal();
    }

    function saveToLocal() { localStorage.setItem('myEngDataV2', JSON.stringify(myData)); }

    // --- ARAYÜZ VE SEKME KONTROLÜ ---
    function showSection(sectionId) {
        document.querySelectorAll('.section-panel').forEach(panel => panel.classList.remove('active-section'));
        document.getElementById(sectionId).classList.add('active-section');
        
        if(sectionId === 'summary') renderSummary();
        if(sectionId === 'game-test') startTestGame();
        if(sectionId === 'game-puzzle') startPuzzleGame();
    }

    function toggleForms() {
        let sel = document.getElementById('data-type-selector').value;
        document.getElementById('form-vocab').classList.add('hidden');
        document.getElementById('form-otonna').classList.add('hidden');
        document.getElementById('form-grammar').classList.add('hidden');
        document.getElementById('new-scenario').classList.add('hidden');

        if(sel === 'word') { document.getElementById('form-vocab').classList.remove('hidden'); }
        if(sel === 'phrase') { 
            document.getElementById('form-vocab').classList.remove('hidden');
            document.getElementById('new-scenario').classList.remove('hidden');
            document.getElementById('new-type').value = "Phrase / Kalıp"; // Otomatik seç
        }
        if(sel === 'otonna') { document.getElementById('form-otonna').classList.remove('hidden'); }
        if(sel === 'grammar') { document.getElementById('form-grammar').classList.remove('hidden'); }
    }

    function checkCustomType() {
        let typeSel = document.getElementById('new-type').value;
        let customInp = document.getElementById('custom-type');
        if(typeSel === 'custom') customInp.classList.remove('hidden');
        else customInp.classList.add('hidden');
    }

    // --- DEFTERİ (ÖZETİ) ÇİZME ---
    function renderSummary() {
        // Kutu 1 ve Kutu 2 (Kelimeler ve Kalıplar)
        let wordsHtml = "", phrasesHtml = "";
        myData.vocab.forEach(v => {
            let itemHtml = `<div style="margin-bottom:15px; border-bottom:1px solid #ddd; padding-bottom:10px;">
                <strong>${v.word}</strong> <span class="tag">${v.type}</span><br>
                <span style="font-size: 0.9rem;">🗣️ <em>Okunuşu:</em> ${v.pron} <br> 🇹🇷 <em>Anlamı:</em> ${v.tr} <br> 📖 <em>Tanımı:</em> ${v.en}</span>
                ${v.scenario ? `<br><span style="font-size: 0.9rem; color:#d35400;">🎬 <em>Senaryo:</em> ${v.scenario}</span>` : ""}
            </div>`;
            if(v.typeCat === 'phrase') phrasesHtml += itemHtml;
            else wordsHtml += itemHtml;
        });
        document.getElementById("words-list").innerHTML = wordsHtml || "<p>Henüz kelime yok.</p>";
        document.getElementById("phrases-list").innerHTML = phrasesHtml || "<p>Henüz kalıp yok.</p>";

        // Kutu 3 (Otonna)
        let otonnaHtml = "";
        myData.otonna.forEach(o => {
            otonnaHtml += `<div style="margin-bottom:15px; border-bottom:1px solid #ddd; padding-bottom:10px;">
                <p style="margin: 0 0 5px 0;"><strong>Before:</strong> ${o.before} <br><span style="font-size:0.85rem; color:#7f8c8d;">(${o.beforeTr})</span></p>
                <p style="margin: 0;"><strong>After:</strong> ${o.after} <br><span style="font-size:0.85rem; color:#7f8c8d;">(${o.afterTr})</span></p>
            </div>`;
        });
        document.getElementById("otonna-list").innerHTML = otonnaHtml || "<p>Henüz Otonna kaydı yok.</p>";

        // Kutu 4 (Grammar)
        let grammarHtml = "";
        myData.grammar.forEach(g => {
            grammarHtml += `<div style="margin-bottom:15px; border-bottom:1px solid #ddd; padding-bottom:10px;">
                <p style="margin:0 0 5px 0; color:#2980b9;"><em>${g.formula}</em></p>
                <p style="margin:0; font-size:0.95rem;"><strong>(+)</strong> ${g.pos}<br><strong>(-)</strong> ${g.neg}<br><strong>(?)</strong> ${g.q}</p>
            </div>`;
        });
        document.getElementById("grammar-list").innerHTML = grammarHtml || "<p>Henüz formül yok.</p>";
    }

    // --- VERİ KAYDETME ---
    function saveData() {
        let sel = document.getElementById('data-type-selector').value;

        if(sel === 'word' || sel === 'phrase') {
            let w = document.getElementById('new-word').value.trim();
            let typeSel = document.getElementById('new-type').value;
            let type = typeSel === 'custom' ? document.getElementById('custom-type').value.trim() : typeSel;
            let p = document.getElementById('new-pron').value.trim();
            let tr = document.getElementById('new-tr').value.trim();
            let en = document.getElementById('new-en').value.trim();
            let scen = document.getElementById('new-scenario').value.trim();

            if(!w || !en) { alert("Kelime ve İngilizce tanım boş bırakılamaz!"); return; }
            
            myData.vocab.push({ id: Date.now(), typeCat: sel, word: w, type: type, pron: p, tr: tr, en: en, scenario: sel === 'phrase' ? scen : null });
        } 
        else if (sel === 'otonna') {
            let b = document.getElementById('ot-before').value.trim();
            let bTr = document.getElementById('ot-before-tr').value.trim();
            let a = document.getElementById('ot-after').value.trim();
            let aTr = document.getElementById('ot-after-tr').value.trim();
            if(!b || !a) { alert("Before ve After cümleleri zorunludur!"); return; }
            myData.otonna.push({ before: b, beforeTr: bTr, after: a, afterTr: aTr });
        }
        else if (sel === 'grammar') {
            let f = document.getElementById('gr-formula').value.trim();
            let pos = document.getElementById('gr-pos').value.trim();
            let neg = document.getElementById('gr-neg').value.trim();
            let q = document.getElementById('gr-q').value.trim();
            if(!f) { alert("Formül kısmı boş bırakılamaz!"); return; }
            myData.grammar.push({ formula: f, pos: pos, neg: neg, q: q });
        }

        saveToLocal();
        document.getElementById('add-feedback').innerText = "✅ Deftere başarıyla eklendi!";
        setTimeout(() => { document.getElementById('add-feedback').innerText = ""; }, 2500);
        
        // Temizlik
        document.querySelectorAll('input[type="text"], textarea').forEach(i => i.value = '');
    }

    // --- OYUN MOTORLARI ---
    let currentQIndex = 0;
    let shuffledQuestions = [];

    function startTestGame() {
        currentQIndex = 0;
        shuffledQuestions = [...myData.vocab].sort(() => 0.5 - Math.random());
        if(shuffledQuestions.length < 2) { alert("Test için defterde en az 2 kelime/kalıp olmalı!"); return; }
        loadTestQuestion();
    }

    function loadTestQuestion() {
        document.getElementById('test-next').classList.add('hidden');
        document.getElementById('test-feedback').innerText = "";
        const optionsArea = document.getElementById('test-options');
        optionsArea.innerHTML = "";
        
        if (currentQIndex >= shuffledQuestions.length) {
            document.getElementById('test-question').innerHTML = "🎉 Tebrikler! Tüm testi bitirdin.";
            return;
        }

        let q = shuffledQuestions[currentQIndex];
        // Telaffuz ve anlamı soruya ekledik
        document.getElementById('test-question').innerHTML = `<strong>İngilizce Tanım:</strong> ${q.en}<br><span style="font-size:0.9rem; color:#555;">(🇹🇷 ${q.tr})</span>`;
        
        let wrongOptions = myData.vocab.filter(v => v.word !== q.word).sort(() => 0.5 - Math.random()).slice(0, 3);
        let allOptions = [q, ...wrongOptions].sort(() => 0.5 - Math.random());

        allOptions.forEach(opt => {
            let btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt.word;
            btn.onclick = () => {
                document.querySelectorAll('#test-options .option-btn').forEach(b => b.disabled = true);
                if(opt.word === q.word) {
                    btn.style.background = "#2ecc71"; btn.style.color = "white";
                    document.getElementById('test-feedback').innerHTML = `✅ Doğru!<br><span style="font-size:1rem; font-weight:normal; color:#333;">🗣️ Okunuşu: ${q.pron}</span>`;
                } else {
                    btn.style.background = "#e74c3c"; btn.style.color = "white";
                    document.getElementById('test-feedback').innerHTML = `❌ Yanlış! Doğrusu: <strong>${q.word}</strong><br><span style="font-size:1rem; font-weight:normal; color:#333;">🗣️ Okunuşu: ${q.pron}</span>`;
                }
                document.getElementById('test-next').classList.remove('hidden');
            };
            optionsArea.appendChild(btn);
        });
    }
    function nextTestQuestion() { currentQIndex++; loadTestQuestion(); }

    // --- BULMACA ---
    let currentPuzzleAnswer = "";
    let currentHintIndex = 0;

    function startPuzzleGame() {
        currentQIndex = 0;
        shuffledQuestions = [...myData.vocab].sort(() => 0.5 - Math.random());
        if(shuffledQuestions.length === 0) { alert("Bulmaca için defterde kelime yok!"); return; }
        loadPuzzleQuestion();
    }

    function loadPuzzleQuestion() {
        document.getElementById('puzzle-next').classList.add('hidden');
        document.getElementById('puzzle-feedback').innerText = "";
        let inputField = document.getElementById('puzzle-input');
        inputField.value = "";
        inputField.disabled = false;
        inputField.style.border = "1px solid #ccc";
        currentHintIndex = 0;
        
        if (currentQIndex >= shuffledQuestions.length) {
            document.getElementById('puzzle-question').innerHTML = "🎉 Tebrikler! Bulmacayı bitirdin.";
            document.querySelector('.puzzle-input-area').style.display = 'none';
            return;
        }

        let q = shuffledQuestions[currentQIndex];
        currentPuzzleAnswer = q.word;
        // Telaffuz ve anlam eklendi
        document.getElementById('puzzle-question').innerHTML = `<strong>Tanım:</strong> ${q.en}<br><span style="font-size:0.9rem; color:#666;">(İpucu: 🇹🇷 ${q.tr} | ${q.word.length} karakter)</span>`;
        inputField.focus();
    }

    function checkPuzzleAnswer() {
        let userInput = document.getElementById('puzzle-input').value.trim().toLowerCase();
        let q = shuffledQuestions[currentQIndex];
        let correctAnswer = currentPuzzleAnswer.toLowerCase();
        let feedback = document.getElementById('puzzle-feedback');

        if (userInput === correctAnswer) {
            feedback.innerHTML = `<span style="color:#27ae60;">✅ Harika! Doğru bildin: <strong>${currentPuzzleAnswer}</strong></span><br><span style="font-size:1rem; font-weight:normal; color:#333;">🗣️ Okunuşu: ${q.pron}</span>`;
            document.getElementById('puzzle-input').style.border = "3px solid #27ae60";
            document.getElementById('puzzle-input').disabled = true;
            document.getElementById('puzzle-next').classList.remove('hidden');
        } else {
            feedback.innerHTML = `<span style="color:#e74c3c;">❌ Tekrar dene veya ipucu iste!</span>`;
            document.getElementById('puzzle-input').style.border = "3px solid #e74c3c";
        }
    }

    function givePuzzleHint() {
        let inputField = document.getElementById('puzzle-input');
        if(currentHintIndex < currentPuzzleAnswer.length) {
            inputField.value = currentPuzzleAnswer.substring(0, currentHintIndex + 1);
            currentHintIndex++;
        }
    }

    function nextPuzzleQuestion() { currentQIndex++; loadPuzzleQuestion(); }

    window.onload = renderSummary;
    document.getElementById('puzzle-input').addEventListener('keypress', function (e) { if (e.key === 'Enter') checkPuzzleAnswer(); });

</script>

</body>
</html>
